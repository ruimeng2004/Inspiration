<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICML 2027 视觉证据互补研究台</title>
<style>
:root{
  color-scheme:light;
  --paper:#edf1f4;--surface:#f9fbfc;--raised:#ffffff;--ink:#16243a;--muted:#55647a;--line:#c9d4dd;
  --accent:#0a6b7f;--accent-soft:#d6e9ed;--harm:#a8285a;--harm-soft:#f5dfe8;--wait:#8a5c00;--wait-soft:#f4e8cc;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,SimSun,serif;
  --sans:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --math:"Cambria Math","STIX Two Math","Latin Modern Math",Georgia,serif;
  --code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --paper:#111925;--surface:#172232;--raised:#1d2a3c;--ink:#e4eaf1;--muted:#a0aebf;--line:#34445a;
  --accent:#62c3d6;--accent-soft:#17404b;--harm:#f08cb2;--harm-soft:#4c2337;--wait:#e4bb68;--wait-soft:#463717;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.65 var(--sans);display:grid;grid-template-columns:196px minmax(0,1fr);}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;height:100vh;position:sticky;top:0;overflow:auto}
.brand{font:600 17px/1.35 var(--serif);padding:0 8px}
.brand small{display:block;font:12px/1.5 var(--sans);color:var(--muted);margin-top:3px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;padding:7px 9px;border-radius:4px;color:var(--muted)}
nav button:hover{background:var(--paper);color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--accent)}
nav button[aria-current=page]{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav span{font-variant-numeric:tabular-nums;font-size:13px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
#save{color:var(--muted);padding:0 4px 6px;line-height:1.45}
#save.warn{color:var(--harm)}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.btn.danger{color:var(--harm)}
main{min-width:0;height:100vh;overflow:auto}
.page{padding:26px 30px 44px;max-width:1240px}
h1{font:600 25px/1.3 var(--serif);margin:0 0 4px}
h2{font:600 18px/1.4 var(--serif);margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 20px;max-width:66ch}
.over{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:30px;align-items:start}
.time{display:flex;gap:30px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.time b{font:600 30px/1.1 var(--serif);display:block}
.time label{display:block;font-size:13px;color:var(--muted)}
.time input{border:0;background:none;padding:0;font-size:13px;color:var(--muted)}
.gate{border-left:3px solid var(--line);padding:0 0 14px 14px;margin:0}
.gate.done{border-color:var(--accent)}
.gate h3{font:600 15px/1.5 var(--sans);margin:0 0 3px}
.gate label{display:flex;gap:8px;align-items:flex-start;padding:2px 0;color:var(--muted);font-size:14px}
.gate input{margin-top:5px;accent-color:var(--accent)}
.sub{margin-top:24px}
.mini{list-style:none;margin:0;padding:0}
.mini li{padding:6px 0;border-bottom:1px solid var(--line)}
.mini button{all:unset;cursor:pointer}
.mini button:hover{color:var(--accent)}
.mini button:focus-visible{outline:2px solid var(--accent)}
.lattice-box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.lattice{position:relative;height:300px;margin:6px auto 8px;max-width:330px}
.lattice svg{position:absolute;inset:0;width:100%;height:100%}
.lattice line{stroke:var(--line);stroke-width:1.5}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;width:76px}
.node label{display:block;font:italic 14px/1.2 var(--math);margin-bottom:2px;background:var(--surface)}
.node input{width:68px;text-align:center;padding:3px;background:var(--raised);border:1px solid var(--line);border-radius:4px}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:var(--surface);padding:4px 8px}
.center b{font:600 25px/1.1 var(--math);display:block}
.center span{font-size:12px;color:var(--muted)}
.config{margin-bottom:18px}
.verdict{font-size:14px;margin:0}
.verdict p{margin:6px 0}
.list-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.list-head input,.list-head select{background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:5px 8px;font-size:14px}
.list-head input{flex:1;min-width:150px;max-width:300px}
.split{display:grid;grid-template-columns:minmax(280px,38%) minmax(0,1fr);gap:24px;align-items:start}
.rows{border-top:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 8px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row[aria-selected=true]{background:var(--accent-soft)}
.row .t{display:block;font-weight:600;line-height:1.45}
.row .s{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.pill{font-size:12px;padding:0 6px;border-radius:3px;background:var(--paper);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--accent-soft);color:var(--accent)}
.pill.no{background:var(--harm-soft);color:var(--harm)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
code,.id{font-family:var(--code);font-size:.88em}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.field{margin-bottom:12px}
.field>label,.field>.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.field textarea{resize:vertical;min-height:62px;line-height:1.6}
.field .big{font:600 17px/1.4 var(--serif)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.checks label{display:flex;gap:8px;font-size:14px;padding:2px 0}
.checks input{width:auto;margin-top:5px;accent-color:var(--accent)}
.detail-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 8px}
.ref{max-width:72ch}
.ref section{margin-bottom:24px}
.ref ul{padding-left:1.2em;margin:6px 0}
.ref table{border-collapse:collapse;width:100%;font-size:14px}
.ref td,.ref th{border-bottom:1px solid var(--line);padding:6px 8px 6px 0;text-align:left;vertical-align:top}
pre{font:13px/1.6 var(--code);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;overflow:auto}
@media (max-width:980px){.over,.split{grid-template-columns:minmax(0,1fr)}.detail{position:static;max-height:none}}
@media (max-width:680px){
  body{display:block}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);gap:10px}
  nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap;gap:6px}
  .rail-foot{flex-direction:row;flex-wrap:wrap;align-items:center}#save{width:100%;padding:0}
  main{height:auto}.page{padding:18px 15px 34px}.two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.detail{animation:in .14s ease-out}@keyframes in{from{opacity:.55}to{opacity:1}}}
</style>
</head>
<body>
<aside class="rail">
  <div class="brand">视觉证据互补<small>ICML 2027 研究台</small></div>
  <nav id="nav" aria-label="主导航"></nav>
  <div class="rail-foot">
    <div id="save" role="status"></div>
    <button class="btn" id="linkFile">同步到本地文件</button>
    <button class="btn" id="exportJson">导出 JSON</button>
    <button class="btn" id="exportMd">导出 Markdown</button>
    <button class="btn" id="importJson">导入 JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</aside>
<main id="main"></main>
<script>
'use strict';
const KEY='icml2027-research-hub-v1';
const clone=o=>JSON.parse(JSON.stringify(o));
const VERIFY='未读取服务器原始产物';
const ST={
 ideas:['候选','验证中','暂缓','淘汰','选定'],
 experiments:['计划中','待授权','运行中','已完成','失败','历史诊断'],
 papers:['待读','已读摘要','已核对方法','已核对附录'],
 decisions:['待决定','已决定','已撤销'],
 notes:['记录','待跟进','已处理']

  {k:'title',l:'标题',t:'title'},{k:'status',l:'状态',t:'status'},{k:'route',l:'路线',t:'select',o:['非次模与结构化互补','贝叶斯实验设计','部分可观测规划','序贯信用分配','基础定义与诊断','其他']},
  {k:'hypothesis',l:'核心假设',t:'area'},{k:'closest',l:'与最近工作的具体差异',t:'area'},{k:'assumptions',l:'必要假设与迁移障碍',t:'area'},

 experiments:{label:'实验',prefix:'E',title:'title',sub:'phase',fields:[
  {k:'title',l:'实验名称',t:'title'},{k:'status',l:'状态',t:'status'},{k:'phase',l:'阶段',t:'select',o:['A 审计','B 诊断','C 推理对照','D RL 后训练']},
  {k:'idea',l:'关联立题',t:'link',to:'ideas'},{k:'runId',l:'运行目录',t:'code'},{k:'reader',l:'Reader 与 revision',t:'text'},
  {k:'question',l:'要回答的问题',t:'area'},{k:'protocol',l:'协议与条件',t:'area'},{k:'units',l:'独立单元与样本量',t:'text'},{k:'budget',l:'资源预算与授权',t:'text'},

  {k:'title',l:'论文',t:'title'},{k:'status',l:'核对状态',t:'status'},{k:'venue',l:'版本与来源',t:'text'},{k:'url',l:'链接',t:'url'},

  {k:'evidence',l:'现象证据',t:'area'},{k:'diff',l:'最近方法差异',t:'area'},{k:'assume',l:'必要假设',t:'area'},{k:'feasible',l:'计算可行性',t:'area'},{k:'counter',l:'反证',t:'area'},{k:'next',l:'下一步最小实验',t:'area'}]},
 notes:{label:'记录',prefix:'N',title:'title',sub:'date',fields:[
  {k:'title',l:'标题',t:'title'},{k:'status',l:'状态',t:'status'},{k:'date',l:'日期',t:'date'},{k:'tags',l:'标签',t:'text'},{k:'body',l:'内容',t:'area',rows:9}]}
};
const VIEWS=[['home','总览'],['ideas','立题'],['experiments','实验'],['papers','文献'],['decisions','决策'],['notes','记录'],['spec','Spec 要点']];
const V6={ideas:[

papers:[
{title:'Optimization with Costly Information: a survey',status:'已读摘要',venue:'Chawla，HALG 2026 综述报告',url:'https://www.cs.utexas.edu/~shuchi/talks/HALG-Survey-6-9-26.pdf',covered:'Pandora Box、Gittins 指数、多阶段信息获取。',open:'下一步精读：多阶段模型假设及其对互补的限制。'},
{title:'Calibrate-Then-Act',status:'已读摘要',venue:'arXiv 2602.16699',url:'https://arxiv.org/html/2602.16699v1',covered:'把部分问题形式化为不确定下的序贯决策，并显式提供先验；含 Pandora Box 示例。',open:'核对能否用于视觉证据和互补任务。'},
{title:'ToolGate',status:'已读摘要',venue:'arXiv 2606.03054',url:'https://arxiv.org/html/2606.03054',covered:'调用前预测工具调用的正边际价值，关联信息价值。',open:'核对单次调用门控与证据组依赖的差异。'},
{title:'Scores Are Not Decisions',status:'待读',venue:'arXiv 2607.27083',url:'https://arxiv.org/pdf/2607.27083',covered:'面向工具获取的成本感知停止。',open:'需读全文，判断与多阶段获取的重叠。'},
{title:'Efficient Cost-Aware LLM Evaluation via Bayesian Bandit Gittins Indices',status:'已读摘要',venue:'ICML 2026',url:'https://icml.cc/virtual/2026/69077',covered:'用 Gittins 指数按信息价值分配评估查询。',open:'核对能否作为反事实查询预算分配基线。'},

{title:'MED：What Does Vision Tool-Use RL Really Learn?',status:'已核对方法',venue:'ICML 2026，arXiv 2602.01334',url:'https://arxiv.org/abs/2602.01334',covered:'分解模型提升、工具增益和工具伤害。',open:'结论限于 crop-and-zoom；作者未提出新算法。'},

{title:'立题讨论阶段总结',status:'记录',date:'2026-11-02',tags:'立题,文献',body:'当前方向恢复为视觉证据互补，不收窄为信用分配或前后动作互补。约束为 RL 后训练、LoRA、不做 SFT、1 张 H200。\nActiveEvidence 研究互补证据获取，但主要是监督控制器和决策证书；二阶交互选证据不能作为本项目创新。\n最拥挤的是工具调用 RL 和单次调用信用；互补结构进入 RL 后训练相对较空，但新颖性未确认。\n候选路线：多观察收益分解 + 互补感知数据选择；多阶段 Pandora 式证据获取。'},
